version: '3.9'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m app.telegram.main
    env_file:
      - .env
    environment:
      - SERVICE_NAME=bot
    volumes:
      - logs_volume:/logs
    depends_on:
      - postgres
      - redis
    restart: always
    networks:
      - app-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m app.worker.main
    env_file:
      - .env
    environment:
      - SERVICE_NAME=worker
    volumes:
      - logs_volume:/logs
    depends_on:
      - postgres
      - redis
      - bot
    restart: always
    networks:
      - app-network

  postgres:
    image: postgres:15
    env_file:
      - .env
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 4G
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - '--requirepass ${REDIS_PASSWORD}'
      - '--rename-command SLAVEOF ""'
      - '--rename-command REPLICAOF ""'
      - '--maxmemory 2048mb'
      - '--maxmemory-policy volatile-lru'
      - '--appendonly yes'
      - '--appendfsync everysec'
      - '--protected-mode yes'
    env_file:
      - .env
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 512M
    restart: always
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  logs_volume:

networks:
  app-network:
    driver: bridge
